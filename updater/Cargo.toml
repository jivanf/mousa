[package]
name = "mousa-launcher"
version = "0.1.1"
edition = "2024"

[dependencies]
anyhow = "1"
directories = "6"
fs2 = "0.4"
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
self_update = { version = "=1.3.2", default-features = false, features = ["ureq", "rustls", "archive-tar", "compression-tar-gz", "signatures"] }
self-replace = "1"
tempfile = "3"

[dev-dependencies]
flate2 = "1"
tar = "0.4"
zipsign-api = { version = "0.2.2", default-features = false, features = ["sign-tar"] }

